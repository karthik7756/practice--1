<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Transaction App</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 480px; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        .badge { background: #22c55e; color: #0f172a; padding: 0.35rem 0.8rem; border-radius: 9999px; font-weight: bold; display: inline-block; margin-bottom: 1.5rem; }
        p { color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Financial Transaction Service</h1>
        <div class="badge">● Live on AWS EKS</div>
        <p>CI/CD pipeline with Jenkins, SonarQube, Nexus, Docker, Ansible, and Kubernetes.</p>
    </div>

</html>
