apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-app
  template:
    metadata:
      labels:
        app: financial-app
    spec:
      containers:
        - name: financial-app
          image: YOUR_DOCKERHUB_USERNAME/financial-transaction-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
